name: Prepare release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check core behavior
        run: ./test.sh
      # The permanent app certificate and Sparkle private key stay in the
      # maintainer's login Keychain. Publish signed assets with publish-update.sh.
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --draft \
              --title "SmarterShot ${GITHUB_REF_NAME}" --generate-notes
          fi
